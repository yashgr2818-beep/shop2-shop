{% extends 'base.html' %}
{% block title %}Register Shop - QR Catalog{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="glass rounded-2xl shadow-xl overflow-hidden">
        <div class="px-8 py-6">
            <h2 class="text-2xl font-bold text-center text-slate-800 mb-8">Register Your Shop</h2>
            <form method="post" class="space-y-6">
                <div>
                    <label for="shop_name" class="block text-sm font-medium text-slate-700">Shop Name</label>
                    <div class="mt-1">
                        <input id="shop_name" name="shop_name" type="text" required class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700">Email Address</label>
                    <div class="mt-1">
                        <input id="email" name="email" type="email" required class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>
                <div>
                    <label for="phone_number" class="block text-sm font-medium text-slate-700">WhatsApp Phone Number (with country code)</label>
                    <div class="mt-1">
                        <input id="phone_number" name="phone_number" type="text" placeholder="e.g. +919876543210" required class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <p class="mt-1 text-xs text-slate-500">Customers will send orders to this number.</p>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" required class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>
                <div>
                    <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all transform hover:scale-[1.02]">
                        Register & Generate QR
                    </button>
                </div>
            </form>
            <div class="mt-6 text-center">
                <p class="text-sm text-slate-600">
                    Already have an account? 
                    <a href="{{ url_for('manager.login') }}" class="font-medium text-blue-600 hover:text-blue-500">Log in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
