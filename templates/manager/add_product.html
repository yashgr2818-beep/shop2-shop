{% extends 'base.html' %}
{% block title %}Add Single Product - QR Catalog{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-6">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-slate-800">Add a Product</h1>
            <p class="text-slate-500 mt-1">Add a single item manually to your catalog.</p>
        </div>
        <a href="{{ url_for('manager.dashboard') }}" class="text-sm font-medium text-slate-500 hover:text-slate-800 flex items-center">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Dashboard
        </a>
    </div>

    <div class="glass rounded-2xl shadow-sm overflow-hidden">
        <div class="px-8 py-6">
            <form method="post" enctype="multipart/form-data" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="sku" class="block text-sm font-medium text-slate-700">SKU (Auto-Generated ID)</label>
                        <input type="text" name="sku" id="sku" value="{{ next_sku }}" readonly disabled class="mt-1 appearance-none block w-full px-3 py-2 border border-slate-200 bg-slate-100 rounded-lg shadow-sm font-mono text-sm text-slate-600 cursor-not-allowed">
                        <p class="text-xs text-slate-400 mt-1">Permanent ID assigned automatically by system.</p>
                    </div>
                    <div>
                        <label for="name" class="block text-sm font-medium text-slate-700">Product Name</label>
                        <input type="text" name="name" id="name" required class="mt-1 appearance-none block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>

                <div>
                    <label for="description" class="block text-sm font-medium text-slate-700">Description (Optional)</label>
                    <textarea name="description" id="description" rows="3" class="mt-1 appearance-none block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="price_inr" class="block text-sm font-medium text-slate-700">Price (₹) {% if manager.price_mandatory %}<span class="text-red-500">*</span>{% endif %}</label>
                        <input type="number" step="0.01" name="price_inr" id="price_inr" {% if manager.price_mandatory %}required{% endif %} class="mt-1 appearance-none block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <div>
                        <label for="stock_qty" class="block text-sm font-medium text-slate-700">Stock Quantity</label>
                        <input type="number" name="stock_qty" id="stock_qty" value="0" required class="mt-1 appearance-none block w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>

                <div>
                    <label for="status" class="block text-sm font-medium text-slate-700">Catalog Visibility</label>
                    <select name="status" id="status" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-slate-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md bg-white">
                        <option value="Active">🟢 Active (Visible on catalog)</option>
                        <option value="Inactive">⚪ Inactive (Hidden from catalog)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Product Image (Optional)</label>
                    <div class="flex items-center space-x-4">
                        <div class="shrink-0">
                            <div class="h-16 w-16 object-cover rounded-md bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-400" id="image-preview">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            </div>
                        </div>
                        <label class="block">
                            <span class="sr-only">Choose profile photo</span>
                            <input type="file" name="image" accept="image/*" onchange="previewImage(event)" class="block w-full text-sm text-slate-500
                              file:mr-4 file:py-2 file:px-4
                              file:rounded-full file:border-0
                              file:text-sm file:font-semibold
                              file:bg-blue-50 file:text-blue-700
                              hover:file:bg-blue-100 transition-colors
                            "/>
                        </label>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-200">
                    <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all">
                        Save Product
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function previewImage(event) {
        var reader = new FileReader();
        reader.onload = function(){
            var output = document.getElementById('image-preview');
            output.innerHTML = '<img src="' + reader.result + '" class="h-16 w-16 object-cover rounded-md shadow-sm" />';
        };
        if (event.target.files[0]) {
            reader.readAsDataURL(event.target.files[0]);
        }
    }
</script>
{% endblock %}
